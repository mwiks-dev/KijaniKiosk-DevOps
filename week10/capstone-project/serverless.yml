service: kijanikiosk-capstone

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'af-south-1'}
  stage: ${opt:stage, 'staging'}
  environment:
    STAGE: ${sls:stage}
    RECEIPTS_BUCKET: ${self:custom.receiptsBucket}
    OUTPUT_BUCKET: ${self:custom.outputBucket}
    
custom:
  receiptsBucket: kijanikiosk-receipts-${sls:stage}
  outputBucket: kijanikiosk-output-${sls:stage}

functions:

  kkReceipts:
    handler: src/kk-receipts/handler.handler

  kkProcessor:
    handler: src/kk-processor/handler.handler

  kkNotifier:
    handler: src/kk-notifier/handler.handler

  kkAnalytics:
    handler: src/kk-analytics/handler.handler

resources:
  Resources:

    ReceiptsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: kijanikiosk-receipts-${self:provider.stage}

    ReceiptsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ReceiptsBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action:
                - s3:GetObject
              Resource:
                - !Sub '${ReceiptsBucket.Arn}/*'
  Outputs:

    ReceiptsBucketName:
      Description: Receipt bucket used by the KijaniKiosk receipt workflow
      Value: !Ref ReceiptsBucket